services:
  - type: web
    name: game-api-ai
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh scripts/download_model.sh && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ai-model-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PATH
        value: /tmp/model.gguf
      - key: MODEL_URL
        value: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf?download=true
      - key: MODEL_N_CTX
        value: 1024
      - key: MODEL_MAX_TOKENS
        value: 128
